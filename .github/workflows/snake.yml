name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *" # refresh twice a day
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate space-themed snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-space-dark.svg?color_snake=#f59e0b&color_dots=#161b33,#3b2f7a,#6d28d9,#a855f7,#f472b6
            dist/snake-space-light.svg?color_snake=#f59e0b&color_dots=#ebedf0,#ddd6fe,#c4b5fd,#a855f7,#db2777

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
