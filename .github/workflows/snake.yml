name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *" # refresh twice a day
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate wave-themed snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-wave-dark.svg?color_snake=#f4a7b9&color_dots=#14335f,#1f4e8c,#2a6fb0,#7fa8cf,#e2482f
            dist/snake-wave-light.svg?color_snake=#e2482f&color_dots=#ebedf0,#cfe0f0,#7fa8cf,#2a6fb0,#14335f

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
