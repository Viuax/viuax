<style>
.tw1{animation:tw 3.2s ease-in-out infinite}
.tw2{animation:tw 4.6s ease-in-out infinite 1.1s}
.tw3{animation:tw 6.1s ease-in-out infinite 2.3s}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.wave1{animation:wv 12s ease-in-out infinite alternate}
.wave2{animation:wv 16s ease-in-out infinite alternate-reverse}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-120px)}}
.comet{animation:cm 8s ease-in infinite 1s;opacity:0}
@keyframes cm{0%{transform:translate(1100px,10px);opacity:0}5%{opacity:1}25%{transform:translate(700px,90px);opacity:0}100%{transform:translate(700px,90px);opacity:0}}
</style>
